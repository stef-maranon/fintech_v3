<script>
    const DEFAULT_DATA = {
      cards: [
        { id: '1', name: 'HSBC', cutoff: 1, debt: 0, paid: 0, color: '#EF4444' },         // Roja
        { id: '2', name: 'NU', cutoff: 2, debt: 0, paid: 0, color: '#8B5CF6' },         // Morada
        { id: '3', name: 'DIDI', cutoff: 6, debt: 0, paid: 0, color: '#F97316' },        // Naranja
        { id: '4', name: 'Citibanamex', cutoff: 7, debt: 0, paid: 0, color: '#EAB308' },  // Dorada
        { id: '5', name: 'Mercado Libre', cutoff: 16, debt: 0, paid: 0, color: '#64748B' }, // Gris
        { id: '6', name: 'Santander', cutoff: 30, debt: 0, paid: 0, color: '#DC2626' },   // Roja
        { id: '7', name: 'BBVA Bancomer', cutoff: 30, debt: 0, paid: 0, color: '#2563EB' } // Azul
      ],
      domiciled: [
        { id: '1', name: 'Internet', amount: 500, paid: false },
        { id: '2', name: 'CFE / Luz', amount: 350, paid: false },
        { id: '3', name: 'Google One', amount: 34, paid: false },
        { id: '4', name: 'iCloud', amount: 17, paid: false }
      ],
      loans: [],
      history: []
    };

    // ===== CONFIGURACIÓN DE FIREBASE =====
    const firebaseConfig = {
      apiKey: "AIzaSyDpHYNnuLQjZlWxfNYFRJdmhHDlK5-geTs",
      authDomain: "stef-fintech.firebaseapp.com",
      databaseURL: "https://stef-fintech-default-rtdb.firebaseio.com",
      projectId: "stef-fintech",
      storageBucket: "stef-fintech.firebasestorage.app",
      messagingSenderId: "786412491071",
      appId: "1:786412491071:web:f45819ad7209651b86bfa6"
    };

    const DB_PATH = 'stef_fintech_data';
    const ALLOWED_EMAIL = 'stefany.maranon@gmail.com';

    let state = DEFAULT_DATA;
    let chartInstance = null;
    let dbRef = null;
    let auth = null;
    let firebaseReady = false;
    let saveTimeout = null;

    function setConnStatus(mode, message) {
      const el = document.getElementById('conn-status');
      const banner = document.getElementById('conn-error-banner');
      const bannerText = document.getElementById('conn-error-text');
      if (mode === 'connecting') {
        el.className = 'text-xs font-semibold text-amber-500 flex items-center gap-1';
        el.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Conectando a Firebase...';
        if(banner) banner.classList.add('hidden');
      } else if (mode === 'connected') {
        el.className = 'text-xs font-semibold text-emerald-600 flex items-center gap-1';
        el.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Conectado a Firebase';
        if(banner) banner.classList.add('hidden');
      } else if (mode === 'error') {
        el.className = 'text-xs font-semibold text-rose-600 flex items-center gap-1';
        el.innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-500"></span> Sin conexión';
        if(bannerText) bannerText.innerText = message || 'No se pudo conectar a Firebase.';
        if(banner) banner.classList.remove('hidden');
      }
    }

    function initFirebase() {
      try {
        const app = firebase.initializeApp(firebaseConfig);
        auth = firebase.auth(app);
        const db = firebase.database(app);
        dbRef = db.ref(DB_PATH);

        let authChecked = false;

        // Escuchar cambios de sesión
        auth.onAuthStateChanged((user) => {
          authChecked = true;
          const loginScreen = document.getElementById('login-screen');
          const loginError = document.getElementById('login-error');

          if (user) {
            if (user.email === ALLOWED_EMAIL) {
              loginScreen.classList.add('hidden');
              loginError.classList.add('hidden');
              startDatabaseSync();
            } else {
              auth.signOut();
              loginScreen.classList.remove('hidden');
              loginError.innerText = `Acceso denegado. La cuenta ${user.email} no está autorizada.`;
              loginError.classList.remove('hidden');
            }
          } else {
            loginScreen.classList.remove('hidden');
            setConnStatus('error', 'Inicia sesión para continuar.');
          }
        });

        // Fallback de seguridad: si en 2.5 segundos auth no responde, mostramos el login obligatoriamente
        setTimeout(() => {
          if (!authChecked) {
            const loginScreen = document.getElementById('login-screen');
            if (loginScreen) loginScreen.classList.remove('hidden');
          }
        }, 2500);

      } catch (err) {
        console.error('Error inicializando Firebase:', err);
        setConnStatus('error', 'Error de inicialización: ' + err.message);
        document.getElementById('login-screen').classList.remove('hidden');
      }
    }

    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch((error) => {
        console.error('Error en el login:', error);
        const loginError = document.getElementById('login-error');
        loginError.innerText = 'Error al iniciar sesión: ' + (error.message || 'Intenta de nuevo.');
        loginError.classList.remove('hidden');
      });
    }

    function logout() {
      if(auth) {
        auth.signOut().then(() => {
          location.reload();
        });
      }
    }

    function startDatabaseSync() {
      setConnStatus('connecting');
      const timeoutId = setTimeout(() => {
        if (!firebaseReady) {
          setConnStatus('error', 'La base de datos está tardando en responder.');
          renderApp();
        }
      }, 8000);

      dbRef.on('value', (snapshot) => {
        clearTimeout(timeoutId);
        firebaseReady = true;
        const data = snapshot.val();
        if (data) {
          state = {
            cards: data.cards || DEFAULT_DATA.cards,
            domiciled: data.domiciled || DEFAULT_DATA.domiciled,
            loans: data.loans || [],
            history: data.history || []
          };
        } else {
          state = DEFAULT_DATA;
          dbRef.set(state).catch(err => console.error('Error sembrando datos:', err));
        }
        setConnStatus('connected');
        renderApp();
      }, (error) => {
        clearTimeout(timeoutId);
        console.error('Error de Firebase:', error);
        setConnStatus('error', 'Error al leer base de datos: ' + error.message);
        renderApp();
      });
    }

    function saveState() {
      renderApp();
      if (dbRef) {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
          dbRef.set(state).catch(err => {
            console.error('Error guardando en Firebase:', err);
            setConnStatus('error', 'No se pudo guardar el cambio: ' + err.message);
          });
        }, 150);
      }
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById('tab-' + tabId).classList.remove('hidden');
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('nav-btn-active'));
      const activeBtn = document.getElementById('btn-' + tabId);
      if(activeBtn) activeBtn.classList.add('nav-btn-active');
    }

    function renderApp() {
      const totalDebt = state.cards.reduce((sum, c) => sum + (c.debt || 0), 0);
      const totalPaid = state.cards.reduce((sum, c) => sum + (c.paid || 0), 0);
      const totalFixed = state.domiciled.reduce((sum, d) => sum + (d.amount || 0), 0);
      const totalLoans = state.loans.filter(l => (l.total || l.amount || 0) > (l.paidAmount || 0)).reduce((sum, l) => sum + ((l.total || l.amount || 0) - (l.paidAmount || 0)), 0);

      document.getElementById('kpi-debt').innerText = `$${totalDebt.toFixed(2)}`;
      document.getElementById('kpi-paid').innerText = `$${totalPaid.toFixed(2)}`;
      document.getElementById('kpi-fixed').innerText = `$${totalFixed.toFixed(2)}`;
      document.getElementById('kpi-loans').innerText = `$${totalLoans.toFixed(2)}`;

      document.getElementById('cards-container').innerHTML = state.cards.map(c => `
        <div class="dashboard-card p-5 space-y-3 relative overflow-hidden border-t-4" style="border-top-color: ${c.color || '#6366F1'};">
          <div class="flex justify-between items-center">
            <h3 class="font-black text-slate-800 text-lg">${c.name}</h3>
            <span class="text-[11px] font-extrabold px-3 py-1 rounded-full text-white" style="background-color: ${c.color || '#6366F1'};">Corte día ${c.cutoff}</span>
          </div>
          <div class="flex justify-between items-baseline pt-1">
            <span class="text-xs text-slate-400 font-bold">DEUDA ACTUAL</span>
            <span class="text-2xl font-black text-rose-600">$${(c.debt||0).toFixed(2)}</span>
          </div>
          <div class="grid grid-cols-2 gap-2 pt-2">
            <button onclick="addTx('${c.id}', 'spend')" class="py-2.5 bg-rose-50 text-rose-600 font-extrabold text-xs rounded-xl hover:bg-rose-100 transition">+ Gasto</button>
            <button onclick="addTx('${c.id}', 'pay')" class="py-2.5 bg-emerald-50 text-emerald-600 font-extrabold text-xs rounded-xl hover:bg-emerald-100 transition">+ Abonar</button>
          </div>
          <button onclick="addToGoogleCalendar('${c.name}', ${c.cutoff})" class="w-full text-center py-2 text-xs bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200 transition">
            📅 Agendar en Google Calendar
          </button>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="editCard('${c.id}')" class="py-2 text-xs bg-slate-50 text-slate-600 font-bold rounded-xl hover:bg-slate-100 transition border border-slate-200">✏️ Editar</button>
            <button onclick="deleteCard('${c.id}')" class="py-2 text-xs bg-rose-50 text-rose-600 font-bold rounded-xl hover:bg-rose-100 transition border border-slate-200">🗑️ Eliminar</button>
          </div>
        </div>
      `).join('');

      const today = new Date().getDate();
      document.getElementById('cutoff-list').innerHTML = state.cards.map(c => {
        const diff = c.cutoff >= today ? c.cutoff - today : (30 - today) + c.cutoff;
        return `
          <div class="flex items-center justify-between p-3.5 bg-slate-50 rounded-2xl border border-slate-100">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs text-white" style="background-color: ${c.color || '#6366F1'};">
                ${c.cutoff}
              </div>
              <div>
                <p class="font-extrabold text-sm text-slate-800">${c.name}</p>
                <p class="text-[11px] text-slate-400 font-semibold">Corte mensual</p>
              </div>
            </div>
            <span class="text-xs font-black px-3 py-1 rounded-full ${diff <= 3 ? 'bg-rose-100 text-rose-600' : 'bg-emerald-100 text-emerald-700'}">
              ${diff === 0 ? '¡Corta Hoy!' : 'Faltan ' + diff + ' días'}
            </span>
          </div>
        `;
      }).join('');

      document.getElementById('domiciled-list').innerHTML = state.domiciled.map(d => `
        <div class="dashboard-card p-4 flex items-center justify-between gap-3">
          <div class="flex items-center gap-3 flex-1 min-w-0">
            <input type="checkbox" ${d.paid ? 'checked' : ''} onchange="toggleDomiciled('${d.id}')" class="w-5 h-5 accent-emerald-500 rounded-lg cursor-pointer shrink-0">
            <div class="min-w-0">
              <p class="font-extrabold text-slate-800 text-sm truncate ${d.paid ? 'line-through text-slate-400' : ''}">${d.name}</p>
              <p class="text-xs text-slate-400 font-semibold">$${d.amount.toFixed(2)} / mes</p>
            </div>
          </div>
          <span class="text-xs font-bold px-2.5 py-1 rounded-lg shrink-0 ${d.paid ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-100 text-slate-500'}">
            ${d.paid ? 'Pagado' : 'Pendiente'}
          </span>
          <div class="flex items-center gap-1.5 shrink-0">
            <button onclick="editDomiciled('${d.id}')" title="Editar" class="w-8 h-8 flex items-center justify-center text-xs bg-slate-50 text-slate-600 font-bold rounded-lg hover:bg-slate-100 transition border border-slate-200">✏️</button>
            <button onclick="deleteDomiciled('${d.id}')" title="Eliminar" class="w-8 h-8 flex items-center justify-center text-xs bg-rose-50 text-rose-600 font-bold rounded-lg hover:bg-rose-100 transition border border-slate-200">🗑️</button>
          </div>
        </div>
      `).join('');

      document.getElementById('loans-list').innerHTML = (state.loans || []).map(l => {
        const total = l.total || l.amount || 0;
        const paidAmount = l.paidAmount || 0;
        const remaining = Math.max(0, total - paidAmount);
        const term = l.term || 3;
        const paymentsList = l.payments || [];

        return `
          <div class="dashboard-card p-5 space-y-4">
            <div class="flex justify-between items-start">
              <div>
                <h3 class="font-extrabold text-slate-900 text-base">${l.debtor}</h3>
                <p class="text-xs text-slate-400">Plazo: <span class="font-bold text-slate-700">${term} meses</span> | Fecha: ${l.date}</p>
              </div>
              <div class="text-right">
                <span class="text-xs font-bold text-slate-400 block">RESTA POR PAGAR</span>
                <span class="text-lg font-black text-amber-600">$${remaining.toFixed(2)}</span>
              </div>
            </div>

            <div class="bg-slate-50 p-3 rounded-xl space-y-2 text-xs">
              <div class="flex justify-between font-bold text-slate-600">
                <span>Total prestado: $${total.toFixed(2)}</span>
                <span class="text-emerald-600">Pagado: $${paidAmount.toFixed(2)}</span>
              </div>
              
              <div class="space-y-1 pt-1 border-t border-slate-200">
                <p class="font-bold text-slate-500">Historial de abonos recibidos:</p>
                ${paymentsList.length === 0 ? '<p class="text-slate-400 italic">Sin abonos registrados aún.</p>' : 
                  paymentsList.map(p => `<div class="flex justify-between text-slate-700"><span>• ${p.date}</span><span class="font-bold text-emerald-600">+$${p.amount.toFixed(2)}</span></div>`).join('')}
              </div>
            </div>

            <div class="flex gap-2">
              <button onclick="addLoanPayment('${l.id}')" class="flex-1 py-2 bg-emerald-50 text-emerald-700 font-extrabold text-xs rounded-xl hover:bg-emerald-100 transition">
                + Registrar Abono y Fecha
              </button>
              <button onclick="deleteLoan('${l.id}')" class="px-3 py-2 bg-rose-50 text-rose-600 font-extrabold text-xs rounded-xl hover:bg-rose-100 transition">
                Eliminar
              </button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('history-rows').innerHTML = state.history.slice(0, 15).map(h => `
        <tr>
          <td class="p-4 text-xs font-medium text-slate-500">${h.date}</td>
          <td class="p-4 text-xs font-bold text-slate-800">${h.card}</td>
          <td class="p-4"><span class="px-2.5 py-1 text-xs font-black rounded-lg ${h.type === 'Gasto' ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}">${h.type}</span></td>
          <td class="p-4 text-xs font-black text-slate-900">$${h.amount.toFixed(2)}</td>
          <td class="p-4">
            <div class="flex items-center gap-1.5">
              <button onclick="editHistoryItem('${h.id}')" title="Editar monto" class="w-8 h-8 flex items-center justify-center text-xs bg-slate-50 text-slate-600 font-bold rounded-lg hover:bg-slate-100 transition border border-slate-200">✏️</button>
              <button onclick="deleteHistoryItem('${h.id}')" title="Eliminar" class="w-8 h-8 flex items-center justify-center text-xs bg-rose-50 text-rose-600 font-bold rounded-lg hover:bg-rose-100 transition border border-slate-200">🗑️</button>
            </div>
          </td>
        </tr>
      `).join('');

      renderChart();
    }

    function addTx(cardId, type) {
      const amount = parseFloat(prompt(type === 'spend' ? 'Monto del gasto:' : 'Monto del abono:'));
      if(!amount || isNaN(amount)) return;
      const card = state.cards.find(c => c.id === cardId);
      if(type === 'spend') {
        card.debt += amount;
      } else {
        card.debt = Math.max(0, card.debt - amount);
        card.paid += amount;
      }
      state.history.unshift({ id: Date.now().toString() + Math.random().toString(36).slice(2), cardId: card.id, date: new Date().toLocaleDateString(), card: card.name, type: type === 'spend' ? 'Gasto' : 'Abono', amount });
      saveState();
    }

    function editHistoryItem(historyId) {
      const item = state.history.find(h => h.id === historyId);
      if(!item) return;
      const newAmountRaw = prompt(`Editar monto de "${item.type}" en ${item.card} (actual $${item.amount.toFixed(2)}):`, item.amount);
      if(newAmountRaw === null) return;
      const newAmount = parseFloat(newAmountRaw);
      if(!newAmount || isNaN(newAmount) || newAmount <= 0) { alert('Monto inválido.'); return; }

      const card = state.cards.find(c => c.id === item.cardId);
      if(card) {
        if(item.type === 'Gasto') {
          card.debt -= item.amount;
        } else {
          card.debt += item.amount;
          card.paid -= item.amount;
        }
        if(item.type === 'Gasto') {
          card.debt += newAmount;
        } else {
          card.debt = Math.max(0, card.debt - newAmount);
          card.paid += newAmount;
        }
        card.debt = Math.max(0, card.debt);
        card.paid = Math.max(0, card.paid);
      }
      item.amount = newAmount;
      saveState();
    }

    function deleteHistoryItem(historyId) {
      const item = state.history.find(h => h.id === historyId);
      if(!item) return;
      if(!confirm(`¿Eliminar este ${item.type.toLowerCase()} de ${item.card} por $${item.amount.toFixed(2)}?`)) return;

      const card = state.cards.find(c => c.id === item.cardId);
      if(card) {
        if(item.type === 'Gasto') {
          card.debt = Math.max(0, card.debt - item.amount);
        } else {
          card.debt += item.amount;
          card.paid = Math.max(0, card.paid - item.amount);
        }
      }
      state.history = state.history.filter(h => h.id !== historyId);
      saveState();
    }

    function openCardModal() {
      const name = prompt('Nombre de la nueva tarjeta:');
      const cutoff = parseInt(prompt('Día de corte (1-31):'));
      if(name && cutoff) {
        state.cards.push({ id: Date.now().toString(), name, cutoff, debt: 0, paid: 0, color: '#4F46E5' });
        saveState();
      }
    }

    function editCard(cardId) {
      const card = state.cards.find(c => c.id === cardId);
      if(!card) return;
      const name = prompt('Nombre de la tarjeta:', card.name);
      if(name === null) return;
      const cutoffRaw = prompt('Día de corte (1-31):', card.cutoff);
      if(cutoffRaw === null) return;
      const cutoff = parseInt(cutoffRaw);
      if(!name.trim() || !cutoff || cutoff < 1 || cutoff > 31) { alert('Datos inválidos.'); return; }
      card.name = name.trim();
      card.cutoff = cutoff;
      state.history.forEach(h => { if(h.cardId === cardId) h.card = card.name; });
      saveState();
    }

    function deleteCard(cardId) {
      const card = state.cards.find(c => c.id === cardId);
      if(!card) return;
      if(!confirm(`¿Eliminar la tarjeta "${card.name}"?`)) return;
      state.cards = state.cards.filter(c => c.id !== cardId);
      saveState();
    }

    function openDomiciledModal() {
      const name = prompt('Nombre del servicio:');
      const amount = parseFloat(prompt('Monto mensual:'));
      if(name && amount) {
        state.domiciled.push({ id: Date.now().toString(), name, amount, paid: false });
        saveState();
      }
    }

    function editDomiciled(id) {
      const item = state.domiciled.find(d => d.id === id);
      if(!item) return;
      const name = prompt('Nombre del servicio:', item.name);
      if(name === null) return;
      const amountRaw = prompt('Monto mensual:', item.amount);
      if(amountRaw === null) return;
      const amount = parseFloat(amountRaw);
      if(!name.trim() || !amount || isNaN(amount) || amount <= 0) { alert('Datos inválidos.'); return; }
      item.name = name.trim();
      item.amount = amount;
      saveState();
    }

    function deleteDomiciled(id) {
      const item = state.domiciled.find(d => d.id === id);
      if(!item) return;
      if(!confirm(`¿Eliminar el servicio "${item.name}"?`)) return;
      state.domiciled = state.domiciled.filter(d => d.id !== id);
      saveState();
    }

    function openLoanModal() {
      const debtor = prompt('¿A quién le prestaste dinero?:');
      const total = parseFloat(prompt('Monto total prestado:'));
      const term = parseInt(prompt('¿A cuántos meses es el plazo? (Ej. 3, 6, 9, 12):') || '3');
      if(debtor && total) {
        if(!state.loans) state.loans = [];
        state.loans.push({ 
          id: Date.now().toString(), 
          debtor, 
          total, 
          term, 
          date: new Date().toLocaleDateString(), 
          paidAmount: 0, 
          payments: [] 
        });
        saveState();
      }
    }

    function addLoanPayment(loanId) {
      const loan = state.loans.find(l => l.id === loanId);
      if(!loan) return;
      const amount = parseFloat(prompt(`Monto del abono recibido de ${loan.debtor}:`));
      if(!amount || isNaN(amount)) return;

      if(!loan.payments) loan.payments = [];
      loan.payments.push({ date: new Date().toLocaleDateString(), amount });
      loan.paidAmount = (loan.paidAmount || 0) + amount;
      saveState();
    }

    function deleteLoan(loanId) {
      if(confirm('¿Eliminar este registro?')) {
        state.loans = state.loans.filter(l => l.id !== loanId);
        saveState();
      }
    }

    function toggleDomiciled(id) {
      const item = state.domiciled.find(d => d.id === id);
      if(item) item.paid = !item.paid;
      saveState();
    }

    function addToGoogleCalendar(cardName, cutoffDay) {
      const now = new Date();
      let eventDate = new Date(now.getFullYear(), now.getMonth(), cutoffDay, 21, 0, 0);
      if (cutoffDay < now.getDate()) eventDate.setMonth(eventDate.getMonth() + 1);

      const title = encodeURIComponent(`Pagar tarjeta ${cardName} - Stef Fintech`);
      const details = encodeURIComponent(`Recordatorio de pago para ${cardName}.`);
      
      const startTime = eventDate.toISOString().replace(/-|:|\.\d+/g, '');
      const endTime = new Date(eventDate.getTime() + 30*60000).toISOString().replace(/-|:|\.\d+/g, '');
      
      const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}&dates=${startTime}/${endTime}`;
      window.open(url, '_blank');
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `Stef_Fintech_Backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          state = JSON.parse(e.target.result);
          saveState();
          alert('¡Datos importados y restaurados con éxito!');
        } catch(err) {
          alert('El archivo no es válido.');
        }
      };
      reader.readAsText(event.target.files[0]);
    }

    function renderChart() {
      const ctx = document.getElementById('debtChart').getContext('2d');
      if(chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: state.cards.map(c => c.name),
          datasets: [{
            data: state.cards.map(c => c.debt),
            backgroundColor: state.cards.map(c => c.color || '#6366F1')
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    window.onload = function() {
      initFirebase();
    };
  </script>
