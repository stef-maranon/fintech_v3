<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stef Fintech</title>
  
  <!-- Favicon Minimalista $ en Azul -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%2310B981'/><text x='50%' y='68%' font-family='system-ui, -apple-system, sans-serif' font-weight='800' font-size='65' fill='white' text-anchor='middle'>$</text></svg>">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Firebase App & Database -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <!-- Firebase Auth -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; color: #0F172A; }
    .dashboard-card { 
      background: #FFFFFF; 
      border: 1px solid #E2E8F0; 
      border-radius: 24px; 
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03); 
    }
    .nav-btn-active { background-color: #10B981 !important; color: white !important; }
    .dark-widget { background: #0F172A; color: white; border-radius: 24px; }
    input, select { font-size: 16px !important; }
  </style>
</head>
<body class="pb-24 md:pb-8">

  <!-- PANTALLA DE LOGIN (Oculta por defecto hasta verificar sesión) -->
  <div id="login-screen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4 hidden">
    <div class="max-w-md w-full bg-white rounded-3xl p-8 shadow-2xl text-center space-y-6">
      <div class="w-16 h-16 bg-emerald-500 rounded-2xl mx-auto flex items-center justify-center text-white font-extrabold text-4xl shadow-lg shadow-emerald-200">
        $
      </div>
      <div>
        <h2 class="text-2xl font-black text-slate-900 tracking-tight">Stef Fintech</h2>
        <p class="text-xs text-slate-500 mt-1">Control financiero personal y seguro</p>
      </div>
      <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100 text-xs text-slate-600">
        Esta aplicación está protegida. Inicia sesión con la cuenta autorizada para acceder a tus datos.
      </div>
      <button onclick="loginWithGoogle()" class="w-full py-3.5 px-4 bg-white hover:bg-slate-50 text-slate-700 font-extrabold text-sm rounded-2xl border border-slate-200 shadow-sm transition flex items-center justify-center gap-3">
        <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.36 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.5-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.12 0 9.87 0 11.7c0 1.83.43 3.58 1.19 5.12l4.09-2.55z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.17 2.64 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
        Continuar con Google
      </button>
      <p id="login-error" class="text-xs font-bold text-rose-500 hidden"></p>
    </div>
  </div>

  <!-- NAVBAR SUPERIOR -->
  <header class="bg-white border-b border-slate-100 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-emerald-500 rounded-2xl flex items-center justify-center text-white font-extrabold text-2xl shadow-md shadow-emerald-200">
          $
        </div>
        <div>
          <h1 class="font-extrabold text-lg tracking-tight text-slate-900">Stef Fintech</h1>
          <p id="conn-status" class="text-xs font-semibold text-amber-500 flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Verificando sesión...
          </p>
        </div>
      </div>

      <nav class="hidden md:flex items-center gap-2 bg-slate-100/80 p-1.5 rounded-2xl border border-slate-200/60">
        <button onclick="switchTab('dashboard')" id="btn-dashboard" class="nav-btn px-4 py-2 rounded-xl text-xs font-bold text-slate-600 transition nav-btn-active">Dashboard</button>
        <button onclick="switchTab('cards')" id="btn-cards" class="nav-btn px-4 py-2 rounded-xl text-xs font-bold text-slate-600 transition">Tarjetas</button>
        <button onclick="switchTab('domiciled')" id="btn-domiciled" class="nav-btn px-4 py-2 rounded-xl text-xs font-bold text-slate-600 transition">Gastos Fijos</button>
        <button onclick="switchTab('loans')" id="btn-loans" class="nav-btn px-4 py-2 rounded-xl text-xs font-bold text-slate-600 transition">Prestado</button>
        <button onclick="switchTab('history')" id="btn-history" class="nav-btn px-4 py-2 rounded-xl text-xs font-bold text-slate-600 transition">Historial</button>
      </nav>

      <div class="flex items-center gap-2">
        <button onclick="exportData()" class="px-3 py-2 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 text-xs font-bold rounded-xl transition border border-emerald-200">
          📥 Exportar
        </button>
        <label class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition cursor-pointer border border-slate-200">
          📤 Importar <input type="file" id="import-file" accept=".json" onchange="importData(event)" class="hidden">
        </label>
        <button onclick="logout()" title="Cerrar sesión" class="px-3 py-2 bg-rose-50 text-rose-700 hover:bg-rose-100 text-xs font-bold rounded-xl transition border border-rose-200">
          🚪 Salir
        </button>
      </div>
    </div>
  </header>

  <!-- BANNER DE ERROR DE CONEXIÓN (oculto por defecto) -->
  <div id="conn-error-banner" class="hidden bg-rose-50 border-b border-rose-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between gap-4">
      <p class="text-sm font-bold text-rose-700 flex items-center gap-2">
        ⚠️ <span id="conn-error-text">No se pudo conectar a Firebase.</span>
      </p>
      <button onclick="location.reload()" class="px-3 py-1.5 bg-rose-600 text-white text-xs font-bold rounded-lg hover:bg-rose-700 transition">
        Reintentar
      </button>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 space-y-6">

    <!-- DASHBOARD TAB -->
    <section id="tab-dashboard" class="tab-content block space-y-6">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Portal > Dashboard</span>
          <h2 class="text-2
